name: Actualizar datos de la BDNS

on:
  schedule:
    # Cada día a las 04:17 UTC, fuera de las horas punta de GitHub Actions.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás que se consultan"
        required: false
        default: "45"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y generar datos
        run: python scripts/actualizar_bdns.py --dias "${{ github.event.inputs.dias || '45' }}"

      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/convocatorias.json data/meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore: actualizar datos de la BDNS ($(date -u +%Y-%m-%d))"
          git push
